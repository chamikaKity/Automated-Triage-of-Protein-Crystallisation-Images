[project]
name = "marco"
version = "0.1.0"
description = "MARCO crystallisation image triage"
requires-python = ">=3.11"
dependencies = [
    "tfrecord",
    "pandas",
    "pillow",
    "scikit-learn",
    "matplotlib",
    "scikit-image",
    "lightgbm",
    "graphviz",
    "torch",
    "torchvision",
    "ipykernel",
    "jupyter",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "lime",
    "anthropic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marco"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
